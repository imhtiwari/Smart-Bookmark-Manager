<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harshit's Smart Bookmarks</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="glass">
  <h1>🔖 Smart Bookmark Manager</h1>
</header>

<main class="glass">

  <section class="bookmark-form">
    <input type="text" id="urlInput" placeholder="Enter website URL">
    <button id="addBookmark">Add</button>
    <button id="deleteAll">Clear All</button>
  </section>

  <input type="text" id="searchInput" placeholder="🔍 Search bookmarks..." class="search">

  <ul id="bookmarkList"></ul>

</main>

<footer class="glass">
  &copy; Harshit Tiwari — Smart Bookmark Manager
</footer>

<script src="index.js"></script>
</body>
</html>
